<!DOCTYPE html>
<html lang="en" data-auth-state="checking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promptly - Settings</title>
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../account/style.css" />
    <link rel="stylesheet" href="../css/top-bar.css" />
  </head>
  <body>
    <header class="top-bar">
      <a class="top-bar-logo" href="/prompt">Promptly<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="/prompt">Prompt</a>
        <div class="account-menu">
          <button type="button" class="account-menu-link" aria-expanded="false">Account ⏷</button>
          <div class="account-dropdown">
            <a href="/dashboard">Dashboard</a>
            <a href="/shop">Premium</a>
            <a href="/account#streak">Streak</a>
            <a href="/account">Account</a>
            <a href="/login" id="logout-link">Log Out</a>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="account-card" aria-labelledby="settings-heading">
        <h1 id="settings-heading">Settings</h1>
        <p class="intro">Update your name and email.</p>
        <dl class="profile">
          <div><dt>Account type</dt><dd id="account-type">Loading…</dd></div>
        </dl>
        <form id="settings" class="profile" novalidate>
          <label for="account-name">Name</label>
          <input id="account-name" autocomplete="name" maxlength="100" aria-required="true" disabled />
          <label for="account-email">Email</label>
          <input id="account-email" type="text" inputmode="email" autocomplete="email" aria-required="true" aria-describedby="email-help" disabled />
          <p id="email-help">Changing your email sends a confirmation link to the new address.</p>
          <button id="save-profile" type="submit" disabled>Save changes</button>
          <p id="settings-message" class="message" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
    </main>
    <script src="/js/account-menu.js" defer></script>
    <script type="module" src="/js/settings.js"></script>
  </body>
</html>
