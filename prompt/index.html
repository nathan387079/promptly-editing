<!DOCTYPE html>
<html lang="en" data-auth-state="checking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Promptly - Prompt</title>
    <link rel="icon" href="../images/favicon.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/prompt/style.css" />
    <link rel="stylesheet" href="../css/top-bar.css" />
    <style>
      html[data-auth-state="checking"] body {
        visibility: hidden;
      }
    </style>
  </head>

  <body>
    <header class="top-bar">
      <a class="top-bar-logo" href="/">Promptly<span>.</span></a>

      <nav aria-label="Main navigation">
        <div class="account-menu">
          <button type="button" class="account-menu-link" aria-expanded="false">Account ⏷</button>
          <div class="account-dropdown">
            <a href="/dashboard">Dashboard</a>
            <a href="/shop">Premium</a>
            <a href="/account#streak">Streak</a>
            <a href="/account">Account</a>
            <a href="/settings">Settings</a>
            <a href="/login" id="logout-link">Log Out</a>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="prompt-section">
        <div class="prompt-box prompt-text">
          <h2 id="daily-prompt">Loading prompt...</h2>
          <div class="prompt-content">
            <textarea
              id="response"
              placeholder="Write your response here..."
              aria-required="true"
              disabled
            ></textarea>
          </div>
          <p id="submit-message" class="prompt-message" role="status" aria-live="polite" aria-atomic="true"></p>
          <button id="submit-button" type="button" aria-disabled="true" disabled>Submit</button>
        </div>
      </section>
    </main>

    <script src="/js/account-menu.js" defer></script>
    <script type="module" src="../js/prompt.js"></script>
  </body>
</html>
